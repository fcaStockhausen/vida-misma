# La Vida Misma - Simulation Configuration
#
# DIRECTOR:
#   calm   = no external pressure, observe cultural/social emergence
#   normal = standard factory pressure with quota escalation
#
# PRODUCTION CHAIN:
#   FoodSource tiles → GATHER → raw_food in inventory
#   ScrapPile tiles  → GATHER → raw_material in inventory
#   Unbuilt Machine  → BUILD (costs raw_material) → operational Machine
#   Operational Machine + WORK → consumes raw_food → produces food
#   Storage tiles hold communal resources (any adjacent agent can deposit/withdraw)
#
# EATING:
#   raw_food: 50% efficiency (survival mode)
#   food:     100% efficiency (proper meals from machines)
#   Sources: inventory or adjacent Storage tile
#
# TENSION:
#   Phase 1 (ticks 0-200):   Agents gather raw food to survive. Barely sustainable.
#   Phase 2 (ticks 200-500): Some agents invest in gathering materials + building.
#                             Risk: builders don't eat. Reward: machines.
#   Phase 3 (ticks 500+):    Machines operational. Workers feed community.
#                             Some agents freed for higher pursuits.

[grid]
width = 60
height = 40

[simulation]
initial_population = 48
max_population = 200
seed = 0
use_wfc = true

[needs]
# Calibrated so survival doesn't dominate every cycle. Slower decay gives agents
# time to build, work, and rest within a single "day cycle" without emergency.
hunger_decay      = 0.0035  # ~285 ticks to max
rest_decay        = 0.0040  # ~250 ticks to max
social_decay      = 0.003
expression_decay  = 0.003
purpose_decay     = 0.002

[actions]
eat_satisfaction     = 0.022
eat_raw_efficiency   = 0.7
eat_food_per_tick    = 0.02
rest_recovery        = 0.020
social_satisfaction  = 0.012
create_satisfaction  = 0.012
explore_satisfaction = 0.008
work_purpose_gain    = 0.004

[production]
gather_rate    = 0.25
build_rate     = 0.12
machine_output = 0.40
machine_mat_output = 0.30
machine_out_output = 0.30
machine_input  = 0.15

[urgency]
alpha = 2.0

[death]
starvation_ticks = 180
exhaustion_ticks = 200

[stress]
high_need = 0.008
decay = 0.005
breakdown_threshold = 0.92

[personality]
compliance_range     = [0.1, 0.95]
laziness_range       = [0.1, 0.90]
artistry_range       = [0.05, 0.85]
gregariousness_range = [0.1, 0.90]
resilience_range     = [0.2, 0.90]
curiosity_range      = [0.1, 0.80]

[movement]
noise = 0.05  # chance of random step instead of toward target

# External pressure — the factory must ship output product through Exit tiles or the
# supply chain contracts (factory_health drops; built machines may break).
[external]
quota_per_tick          = 0.10    # food units demanded out per tick
health_decay_per_miss   = 0.0015  # factory_health drop when quota not met
health_recovery_per_hit = 0.0008  # factory_health rise when quota met
machine_break_threshold = 0.40    # below this, built machines may revert to unbuilt
machine_break_prob      = 0.0008  # per-tick probability per built machine when health low
initial_food_per_agent  = 5.0     # bootstrap so agents survive while building infrastructure

# Eating zones — agents build designated eating spaces, must stay away from the
# work zone, and pay a social cost if they eat next to a Machine.
[eating]
inv_food_cap                = 2.0    # max food an agent can carry ("una vianda")
min_dist_to_machine         = 5      # Manhattan distance an EatingZone must keep from machines
build_cost                  = 2.0    # raw_material to construct an EatingZone (~17 BUILD ticks)
eat_at_work_health_decay    = 0.002  # factory_health drop per eat-at-work tick
eat_at_work_stress          = 0.010  # stress added to the transgressor per eat-at-work tick
witness_radius              = 3      # another agent within Manhattan ≤ N "reports" the transgression
                                     # — without a witness present, no penalty fires.

# Director — the meta-agent that modulates external pressure.
# calm:   no quota, no deterioration, no restructure — pure observation
# normal: standard factory pressure with quota escalation
[director]
mode = "normal"
