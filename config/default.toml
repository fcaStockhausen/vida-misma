# La Vida Misma - Simulation Configuration
#
# DIRECTOR:
#   calm   = no external pressure, observe cultural/social emergence
#   normal = standard factory pressure with quota escalation
#
# PRODUCTION CHAIN:
#   FoodSource tiles → GATHER → raw_food in inventory
#   ScrapPile tiles  → GATHER → raw_material in inventory
#   Unbuilt Machine  → BUILD (costs raw_material) → operational Machine
#   Operational Machine + WORK → consumes raw_food → produces food
#   Storage tiles hold communal resources (any adjacent agent can deposit/withdraw)
#
# EATING:
#   raw_food: 50% efficiency (survival mode)
#   food:     100% efficiency (proper meals from machines)
#   Sources: inventory or adjacent Storage tile
#
# TENSION:
#   Phase 1 (ticks 0-200):   Agents gather raw food to survive. Barely sustainable.
#   Phase 2 (ticks 200-500): Some agents invest in gathering materials + building.
#                             Risk: builders don't eat. Reward: machines.
#   Phase 3 (ticks 500+):    Machines operational. Workers feed community.
#                             Some agents freed for higher pursuits.

[grid]
width = 60
height = 40

[simulation]
initial_population = 48
max_population = 200
seed = 0
use_wfc = true

[needs]
# Calibrated so survival doesn't dominate every cycle. Slower decay gives agents
# time to build, work, and rest within a single "day cycle" without emergency.
hunger_decay      = 0.0035  # ~285 ticks to max
rest_decay        = 0.0040  # ~250 ticks to max
social_decay      = 0.003
expression_decay  = 0.003
purpose_decay     = 0.002

[actions]
eat_satisfaction     = 0.022
eat_raw_efficiency   = 0.7
eat_food_per_tick    = 0.02
rest_recovery        = 0.020
social_satisfaction  = 0.012
create_satisfaction  = 0.012
explore_satisfaction = 0.008
work_purpose_gain    = 0.004

[production]
gather_rate    = 0.25
build_rate     = 0.12
machine_output = 0.40
machine_mat_output = 0.30
machine_out_output = 0.30
machine_input  = 0.15
portion_size   = 1.0      # one "vianda" = this much food units

# Conveyor belts — condition decays, agents MAINTAIN them. Belts carry one
# resource type at a time and deposit into Storage or (future) downstream machines.
[conveyor]
build_cost    = 1.5      # raw_material per segment
decay_rate    = 0.0005   # condition loss per tick
throughput    = 0.5      # max resource movement per tick
maintain_rate = 0.08     # condition restored per MAINTAIN tick

# Dismantle — agents can tear down structures; partial material refund.
[dismantle]
return           = 0.5   # fraction of build_cost returned on DISMANTLE
rebuild_window   = 200   # ticks before social penalty for not rebuilding

[urgency]
alpha = 2.0

[death]
starvation_ticks = 180
exhaustion_ticks = 200

[disease]
raw_food_chance = 0.08    # chance of disease per raw meal (no machine processing)
severity        = 0.15    # disease increase per contraction
recovery        = 0.002   # disease decay per tick (immune system)
hunger_mult     = 2.0     # hunger decay multiplier at disease=1.0

[stress]
high_need                = 0.008
decay                    = 0.005
breakdown_threshold      = 0.92
sabotage_threshold       = 0.6     # stress >= this opens SABOTAGE utility
noncompliance_stress     = 0.002   # stress per tick per noncompliance level
trauma_accumulation_rate = 0.001   # per tick while stress > 0.5
trauma_resilience_impact = 0.5     # effective_resilience *= (1 - trauma * this)
trauma_social_impact     = 0.3     # effective_gregariousness *= (1 - trauma * this)
redemption_chance        = 0.08    # per sabotage tick, chance of epiphany
suicide_chance           = 0.03    # per sabotage tick, chance of self-destruction
selection_temperature    = 0.4     # Boltzmann action selection (0=greedy, higher=more random)

[personality]
compliance_range     = [0.1, 0.95]
laziness_range       = [0.1, 0.90]
artistry_range       = [0.05, 0.85]
gregariousness_range = [0.1, 0.90]
resilience_range     = [0.2, 0.90]
curiosity_range      = [0.1, 0.80]

[movement]
noise = 0.05  # chance of random step instead of toward target

# External pressure — the factory must ship output product through Exit tiles or the
# supply chain contracts (factory_health drops; built machines may break).
[external]
quota_per_tick          = 0.10      # output units demanded out per tick
quota_growth_rate       = 0.00002   # quota increase per tick (factory demands more)
health_decay_per_miss   = 0.0015    # factory_health drop when quota not met
health_recovery_per_hit = 0.0008    # factory_health rise when quota met
machine_break_threshold = 0.40      # below this, built machines may revert to unbuilt
machine_break_prob      = 0.0008    # per-tick probability per built machine when health low
initial_food_per_agent  = 5.0       # bootstrap so agents survive while building infrastructure
restructure_interval    = 800       # ticks between restructure checks
restructure_probability = 0.2       # chance per check

# Adversarial factory — the factory evaluates candidate targets by strategic
# value (throughput, output stock, Exit connectivity) and by proximity to the
# largest faction, then softmax-selects. With adversary_intensity=0 this
# collapses to the original uniform-random behavior (baseline).
adversary_intensity      = 0.7     # α∈[0,1]: 0=random baseline, 1=best-response, mid=edge-of-chaos
restructure_temperature  = 0.3     # τ for softmax over candidate scores (higher=more random)
strategic_weight         = 1.0     # weight of strategic score vs uniform in the blend
faction_target_bonus     = 1.5     # score bonus when target is near the largest faction

# The Watcher — loyal high-influence, high-compliance agents ("foremen") report
# noncompliant neighbors, eroding the reporter's trust toward the dissident.
# This is Task A3 of the factory-as-antagonist plan: the factory acts THROUGH
# loyal agents, not just as ambient damage.
watcher_influence_threshold    = 0.15  # SocialComponent.influence required to report
                                        # (influence rarely exceeds ~0.15 under factory pressure)
watcher_compliance_threshold   = 0.7   # PersonalityComponent.compliance required to report
watcher_radius                 = 4     # Manhattan radius a reporter scans
noncompliance_report_threshold = 0.5   # AgentComponent.noncompliance above which reported
report_severity                = 0.02  # trust penalty on reporter→dissident edge per report

# Eating zones — agents build designated eating spaces, must stay away from the
# work zone, and pay a social cost if they eat next to a Machine.
[eating]
inv_food_cap                = 2.0    # max food an agent can carry ("una vianda")
min_dist_to_machine         = 5      # Manhattan distance an EatingZone must keep from machines
build_cost                  = 2.0    # raw_material to construct an EatingZone (~17 BUILD ticks)
eat_at_work_health_decay    = 0.002  # factory_health drop per eat-at-work tick
eat_at_work_stress          = 0.010  # stress added to the transgressor per eat-at-work tick
witness_radius              = 3      # another agent within Manhattan ≤ N "reports" the transgression
                                     # — without a witness present, no penalty fires.

# Director — the meta-agent that modulates external pressure.
# calm:   no quota, no deterioration, no restructure — pure observation
# normal: standard factory pressure with quota escalation
[director]
mode = "normal"
